# /etc/systemd/system/hypercore-daily.service.d/hourly.conf
# Drop-in for the hourly cadence: a run must finish well inside the hour.
# (reference only: deploy/bootstrap.sh writes the equivalent local.conf; MemoryMax lives
# in deploy/hypercore-daily.service, 32G since v1.9.1)
[Service]
TimeoutStartSec=50min
