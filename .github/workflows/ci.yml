name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt -c constraints.txt
      - run: python -m compileall -q blueblocx_hyperliquid tests deploy
      - run: python -m unittest discover -s tests -t . -v
      - name: preflight (offline — deps, DDL, env sanity, paths)
        run: python -m blueblocx_hyperliquid.preflight --offline

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t blueblocx-hyperliquid:ci .
      - name: image smoke — tests + offline preflight inside the container
        run: |
          docker run --rm blueblocx-hyperliquid:ci unittest discover -s tests -t .
          docker run --rm blueblocx-hyperliquid:ci blueblocx_hyperliquid.preflight --offline
